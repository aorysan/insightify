<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  {{STYLE}}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <div class="premium-meta-header">
    BLUEPRINT SISTEM &bull; V1 &bull; TANGGAL
  </div>
  <main class="main-content">
    <header class="page-header">
      <div class="header-actions">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <a href="#" class="print-link" onclick="window.print(); return false;" aria-label="Print documentation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/>
          </svg>
          <span class="print-text">Print</span>
        </a>
      </div>
    </header>

    <div class="content-wrapper">
      <article class="doc-content">
        <div class="artifact-container">
          <!-- Product Overview -->
          <section id="overview" class="doc-section">
            <span class="section-label">Overview</span>
            <h1>{{PRODUCT_NAME}}</h1>
            <p class="tagline">{{TAGLINE}}</p>
            {{PRODUCT_OVERVIEW}}
          </section>

          <!-- 14 Documentation Sections in Plan Order -->
          {{DOC_SECTIONS}}

          <!-- Process / Pipeline diagram -->
          <section id="pipeline" class="doc-section">
            <span class="section-label">Process</span>
            <h2>Documentation Pipeline</h2>
            {{PROCESS_DIAGRAM}}
          </section>
        </div>
      </article>

      <aside class="toc-container">
        <nav class="floating-toc">
          <h3 class="toc-title">Table of Contents</h3>
          {{SIDEBAR_NAV}}
        </nav>
      </aside>
    </div>
  </main>

  {{SCRIPTS}}
</body>
</html>
