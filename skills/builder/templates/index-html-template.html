<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  {{STYLE}}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <!-- CSS-only sidebar toggle -->
  <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle" hidden>
  <label for="sidebar-toggle" class="sidebar-overlay" aria-hidden="true"></label>

  <aside class="sidebar" role="navigation" aria-label="Documentation navigation">
    <header class="sidebar-header">
      <h1 class="project-title">{{PRODUCT_NAME}}</h1>
      <p class="project-desc">{{TAGLINE}}</p>
      <span class="version-badge">v{{VERSION}}</span>
    </header>
    <nav class="sidebar-nav">
      {{SIDEBAR_NAV}}
    </nav>
    <footer class="sidebar-footer">
      <span>Generated by Insightify v{{INSIGHTIFY_VERSION}}</span>
      <span>{{GENERATED_AT}}</span>
    </footer>
  </aside>

  <main class="main-content">
    <header class="page-header">
      <label for="sidebar-toggle" class="sidebar-trigger" aria-label="Toggle navigation">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12h18M3 6h18M3 18h18"/>
        </svg>
      </label>
      <div class="header-actions">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <a href="#" class="print-link" onclick="window.print(); return false;" aria-label="Print documentation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/>
          </svg>
          <span class="print-text">Print</span>
        </a>
      </div>
    </header>

    <article class="doc-content">
      <!-- Product Overview -->
      <section id="overview" class="doc-section">
        <span class="section-label">Overview</span>
        <h1>{{PRODUCT_NAME}}</h1>
        <p class="tagline">{{TAGLINE}}</p>
        {{PRODUCT_OVERVIEW}}
      </section>

      <!-- 14 Documentation Sections in Plan Order -->
      {{DOC_SECTIONS}}

      <!-- Process / Pipeline diagram -->
      <section id="pipeline" class="doc-section">
        <span class="section-label">Process</span>
        <h2>Documentation Pipeline</h2>
        {{PROCESS_DIAGRAM}}
      </section>
    </article>
  </main>

  {{SCRIPTS}}
</body>
</html>
